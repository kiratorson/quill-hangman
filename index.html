<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fall Edition Hangman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF2F6;
    --card: #FFFFFF;
    --ink: #232838;
    --muted: #767F92;
    --line: #DFE5EC;
    --coral: #FF8B76;
    --coral-ink: #7A2C1D;
    --mint: #7FD9C4;
    --mint-ink: #144F42;
    --butter: #FFD873;
    --peri: #9AA6FF;
    --peri-ink: #262B6E;
    --wrong: #C9CFDA;
    --radius: 18px;
    --radius-sm: 10px;
    --blue-stroke: #1D4ED8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, #E3ECF7 0%, transparent 45%),
      radial-gradient(circle at 92% 88%, #F3E9F7 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }
  .wordmark{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
  }
  .wordmark span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 17px;
    letter-spacing: 0.01em;
  }
  .wordmark .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--coral);
    display:inline-block;
    margin-right:8px;
    position:relative;
    top:-1px;
  }
  .card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 1px 2px rgba(35,40,56,0.04), 0 10px 30px -14px rgba(35,40,56,0.15);
  }
  .btn{
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    transition: transform .08s ease, box-shadow .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: var(--ink);
    color: #fff;
  }
  .btn-primary:hover{ box-shadow: 0 6px 18px -8px rgba(35,40,56,0.5); }
  .btn-secondary{
    background: #F0F2F7;
    color: var(--ink);
  }

  .play-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
  }
  .mistakes-text{
    font-size: 13px;
    color: var(--muted);
    text-align:right;
    margin-bottom: 18px;
  }
  .mistakes-text b{ color: var(--ink); }
  .lives{
    display:flex;
    gap:6px;
  }
  .life-dot{
    width:11px; height:11px;
    border-radius:50%;
    background: var(--peri);
  }
  .life-dot.used{ background: var(--wrong); }

  .image-container {
    width: 160px;
    height: 160px;
    margin: 15px auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .image-container svg {
    width: 100%;
    height: 100%;
  }

  .confirm-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(35,40,56,0.32);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .confirm-card{
    background:#fff;
    border-radius: var(--radius);
    padding: 26px 24px;
    max-width: 320px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 50px -15px rgba(35,40,56,0.4);
  }
  .confirm-letter{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 44px;
    width: 68px; height:68px;
    border-radius: 16px;
    background: #F0F2F7;
    display:flex;align-items:center;justify-content:center;
    margin: 0 auto 14px;
  }
  .confirm-card p{
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .confirm-card .btns{ display:flex; gap:10px; }
  .confirm-card .btns .btn{ flex:1; padding:12px 10px; font-size:14px; }

  .tiles{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    justify-content:center;
    margin: 20px 0 16px;
  }
  .tile{
    width: 38px; height: 46px;
    border-bottom: 3px solid var(--line);
    display:flex; align-items:flex-end; justify-content:center;
    font-family:'Fraunces', serif;
    font-size: 26px;
    font-weight:600;
    padding-bottom: 2px;
    color: var(--ink);
  }
  .tile.gap{ border-bottom:none; width:18px; }
  .tile.filled{ border-color: var(--peri); }

  .hint-line{
    text-align:center;
    font-style: italic;
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 16px;
  }

  .kb{
    display:flex;
    flex-direction:column;
    gap: 8px;
    align-items:center;
    margin-bottom: 8px;
  }
  .kb-row{ display:flex; gap: 6px; }
  .key{
    min-width: 32px;
    height: 42px;
    padding: 0 8px;
    border-radius: 8px;
    border: none;
    background: #F0F2F7;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor:pointer;
  }
  .key:focus-visible{ outline: 2px solid var(--peri); outline-offset:2px; }
  .key.correct{ background: var(--mint); color: var(--mint-ink); }
  .key.wrong{ background: var(--wrong); color: #8891A0; }
  .key:disabled{ cursor:default; }

  .overlay{
    margin-top: 22px;
    border-radius: var(--radius);
    padding: 26px;
    text-align:center;
  }
  .overlay.win{ background: #EAFBF5; }
  .overlay.lose{ background: #F3F1FB; }
  .overlay h2{
    font-family:'Fraunces', serif;
    font-size: 28px;
    margin: 0 0 8px;
  }
  .overlay p{ color: var(--muted); margin: 0 0 18px; font-size:15px; }
  .overlay .btns{ display:flex; gap:10px; justify-content:center; }

  @media (max-width:480px){
    .tile{ width:30px; height:40px; font-size:20px; }
    .key{ min-width:26px; height:38px; padding:0 6px; font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  const MAX_WRONG = 5;

  const WORDS = [
    {
      word: 'PE POINTS',
      hint: 'Something you probably forgot to log last year'
    },
    {
      word: 'CLASSROOM',
      hint: 'Always sending you emails'
    },
    {
      word: 'DISPOSITION',
      hint: "A sixth grader's only worry"
    },
    {
      word: 'SYLLABUS',
      hint: 'Read during week 1 and then forgotten'
    }
  ];

  let currentIndex = 0;
  let guessedLetters = new Set();
  let wrongCount = 0;
  let pendingLetter = null;
  let gameState = 'PLAYING';

  function initGame(){
    guessedLetters.clear();
    wrongCount = 0;
    pendingLetter = null;
    gameState = 'PLAYING';
    render();
  }

  function confirmLetter(letter){
    pendingLetter = letter;
    render();
  }

  function applyPendingLetter(confirmed){
    if(confirmed && pendingLetter){
      const currentWord = WORDS[currentIndex].word.toUpperCase();
      guessedLetters.add(pendingLetter);
      
      if(!currentWord.includes(pendingLetter)){
        wrongCount++;
      }

      checkGameStatus();
    }
    pendingLetter = null;
    render();
  }

  function checkGameStatus(){
    const currentWord = WORDS[currentIndex].word.toUpperCase();
    const uniqueLetters = new Set(currentWord.replace(/[^A-Z]/g, ''));
    
    let allGuessed = true;
    for(let char of uniqueLetters){
      if(!guessedLetters.has(char)){
        allGuessed = false;
        break;
      }
    }

    if(allGuessed){
      gameState = 'WIN';
    } else if(wrongCount >= MAX_WRONG){
      gameState = 'LOSE';
    }
  }

  function nextWord(){
    currentIndex = (currentIndex + 1) % WORDS.length;
    initGame();
  }

  function renderHangmanSVG(mistakes){
    return `
      <svg viewBox="0 0 160 160" stroke="var(--blue-stroke)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- 1st Mistake: Center Circle -->
        ${mistakes >= 1 ? '<circle cx="80" cy="80" r="30" />' : ''}
        
        <!-- 2nd Mistake: Left side of square -->
        ${mistakes >= 2 ? '<line x1="20" y1="20" x2="20" y2="140" />' : ''}
        
        <!-- 3rd Mistake: Right side of square -->
        ${mistakes >= 3 ? '<line x1="140" y1="20" x2="140" y2="140" />' : ''}
        
        <!-- 4th Mistake: Top side connecting left and right -->
        ${mistakes >= 4 ? '<line x1="20" y1="20" x2="140" y2="20" />' : ''}
        
        <!-- 5th Mistake: Bottom side connecting left and right -->
        ${mistakes >= 5 ? '<line x1="20" y1="140" x2="140" y2="140" />' : ''}
      </svg>
    `;
  }

  function render(){
    const current = WORDS[currentIndex];
    const wordUpper = current.word.toUpperCase();

    let html = `
      <div class="wordmark">
        <span><span class="dot"></span>Fall Hangman</span>
        <span style="font-size:13px; color:var(--muted); font-weight:600;">Word ${currentIndex + 1} of ${WORDS.length}</span>
      </div>
      
      <div class="card">
        <div class="play-top">
          <div class="lives">
            ${Array.from({length: MAX_WRONG}).map((_, i) => 
              `<div class="life-dot ${i < wrongCount ? 'used' : ''}"></div>`
            ).join('')}
          </div>
          <div class="mistakes-text">Mistakes: <b>${wrongCount}/${MAX_WRONG}</b></div>
        </div>

        <div class="hint-line">"${current.hint}"</div>

        <div class="image-container">
          ${renderHangmanSVG(wrongCount)}
        </div>

        <div class="tiles">
          ${wordUpper.split('').map(char => {
            if(char === ' '){
              return `<div class="tile gap"></div>`;
            }
            const isRevealed = guessedLetters.has(char) || gameState === 'LOSE';
            return `<div class="tile ${isRevealed ? 'filled' : ''}">${isRevealed ? char : ''}</div>`;
          }).join('')}
        </div>

        ${gameState === 'PLAYING' ? renderKeyboard() : ''}
        ${renderOverlay()}
      </div>

      ${renderConfirmModal()}
    `;

    app.innerHTML = html;
    bindEvents();
  }

  function renderKeyboard(){
    const rows = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['Z','X','C','V','B','N','M']
    ];

    const currentWord = WORDS[currentIndex].word.toUpperCase();

    return `
      <div class="kb">
        ${rows.map(row => `
          <div class="kb-row">
            ${row.map(letter => {
              const isGuessed = guessedLetters.has(letter);
              const isCorrect = isGuessed && currentWord.includes(letter);
              const isWrong = isGuessed && !currentWord.includes(letter);
              let classNames = 'key';
              if(isCorrect) classNames += ' correct';
              if(isWrong) classNames += ' wrong';

              return `<button class="${classNames}" ${isGuessed ? 'disabled' : ''} data-letter="${letter}">${letter}</button>`;
            }).join('')}
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderConfirmModal(){
    if(!pendingLetter) return '';
    return `
      <div class="confirm-backdrop">
        <div class="confirm-card">
          <div class="confirm-letter">${pendingLetter}</div>
          <p>Are you sure you want to guess this letter?</p>
          <div class="btns">
            <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
            <button class="btn btn-primary" id="btn-confirm">Confirm</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderOverlay(){
    if(gameState === 'PLAYING') return '';

    const isWin = gameState === 'WIN';
    const isLast = currentIndex === WORDS.length - 1;

    return `
      <div class="overlay ${isWin ? 'win' : 'lose'}">
        <h2>${isWin ? 'You Won!' : 'Game Over'}</h2>
        <p>${isWin ? 'Great job! You solved this word.' : `The correct word was: <b>${WORDS[currentIndex].word}</b>`}</p>
        <div class="btns">
          <button class="btn btn-primary" id="btn-next">
            ${isLast ? 'Restart Game' : 'Go to Next Word'}
          </button>
        </div>
      </div>
    `;
  }

  function bindEvents(){
    document.querySelectorAll('.key').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const letter = e.target.getAttribute('data-letter');
        if(letter) confirmLetter(letter);
      });
    });

    const cancelBtn = document.getElementById('btn-cancel');
    if(cancelBtn){
      cancelBtn.addEventListener('click', () => applyPendingLetter(false));
    }

    const confirmBtn = document.getElementById('btn-confirm');
    if(confirmBtn){
      confirmBtn.addEventListener('click', () => applyPendingLetter(true));
    }

    const nextBtn = document.getElementById('btn-next');
    if(nextBtn){
      nextBtn.addEventListener('click', () => nextWord());
    }
  }

  initGame();
})();
</script>
</body>
</html>
