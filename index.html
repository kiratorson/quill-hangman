<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fall Edition Hangman</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #6c5ce7;
      --accent-hover: #5a4bcf;
      --disabled-color: #dcdde1;
      --wrong-color: #e74c3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .game-container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 32px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wordmark {
      height: 24px;
      margin-bottom: 8px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-color);
    }

    .mistakes {
      font-weight: 600;
      font-size: 14px;
      color: #666;
    }

    .stage-container {
      width: 200px;
      height: 200px;
      background-color: #f8f9fa;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .stage-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .word-display {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      min-height: 40px;
    }

    .hint {
      font-style: italic;
      color: #666;
      margin-bottom: 24px;
      text-align: center;
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .keyboard-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .key {
      background-color: #f1f2f6;
      border: none;
      border-radius: 6px;
      padding: 12px 0;
      width: 36px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .key:hover:not(:disabled) {
      background-color: var(--accent-color);
      color: white;
    }

    .key:disabled {
      background-color: var(--disabled-color);
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="wordmark"></div>

    <div class="header">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="mistakes">Mistakes: <span id="mistake-count">0</span>/5</div>
    </div>

    <div class="stage-container">
      <img id="stage-img" class="stage-image" src="Screenshot_2026-09-05_at_6.55.00_PM-removebg-preview.png" alt="Hangman Stage">
    </div>

    <div id="word-display" class="word-display"></div>
    <div id="hint-display" class="hint"></div>

    <div class="keyboard" id="keyboard"></div>
  </div>

  <script>
    const WORDS = [
      { word: "CANVAS", hint: "Always getting updated for some reason" },
      { word: "SYLLABUS", hint: "Unread agreement of the classroom" },
      { word: "HOMEWORK", hint: "Due at 11:59 PM" }
    ];

    const STAGE_IMAGES = [
      "Screenshot_2026-09-05_at_6.55.00_PM-removebg-preview.png",
      "Screenshot_2026-09-05_at_6.55.51_PM-removebg-preview.png",
      "Screenshot_2026-09-05_at_6.55.14_PM-removebg-preview.png",
      "Screenshot_2026-09-05_at_7.11.26_PM-removebg-preview.png",
      "Screenshot_2026-09-05_at_6.54.53_PM-removebg-preview.png"
    ];

    const KEYBOARD_LAYOUT = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
      ["Z", "X", "C", "V", "B", "N", "M"]
    ];

    const MAX_WRONG = 5;
    let currentWordIndex = 0;
    let guessedLetters = new Set();
    let mistakes = 0;

    const wordDisplay = document.getElementById("word-display");
    const hintDisplay = document.getElementById("hint-display");
    const mistakeCount = document.getElementById("mistake-count");
    const stageImg = document.getElementById("stage-img");
    const keyboardContainer = document.getElementById("keyboard");

    function initKeyboard() {
      keyboardContainer.innerHTML = "";
      KEYBOARD_LAYOUT.forEach(row => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "keyboard-row";
        row.forEach(letter => {
          const btn = document.createElement("button");
          btn.className = "key";
          btn.textContent = letter;
          btn.id = `key-${letter}`;
          btn.addEventListener("click", () => handleGuess(letter));
          rowDiv.appendChild(btn);
        });
        keyboardContainer.appendChild(rowDiv);
      });
    }

    function loadWord() {
      guessedLetters.clear();
      mistakes = 0;
      updateDisplay();

      const current = WORDS[currentWordIndex];
      hintDisplay.textContent = `"${current.hint}"`;

      document.querySelectorAll(".key").forEach(btn => {
        btn.disabled = false;
      });
    }

    function updateDisplay() {
      const current = WORDS[currentWordIndex];
      
      wordDisplay.textContent = current.word
        .split("")
        .map(letter => (guessedLetters.has(letter) ? letter : "_"))
        .join(" ");

      mistakeCount.textContent = mistakes;
      stageImg.src = STAGE_IMAGES[mistakes] || STAGE_IMAGES[STAGE_IMAGES.length - 1];
    }

    function handleGuess(letter) {
      if (guessedLetters.has(letter) || mistakes >= MAX_WRONG) return;

      guessedLetters.add(letter);
      const btn = document.getElementById(`key-${letter}`);
      if (btn) btn.disabled = true;

      const current = WORDS[currentWordIndex];

      if (!current.word.includes(letter)) {
        mistakes++;
      }

      updateDisplay();
      checkGameStatus();
    }

    function loadNextWord() {
      currentWordIndex = (currentWordIndex + 1) % WORDS.length;
      loadWord();
    }

    function checkGameStatus() {
      const current = WORDS[currentWordIndex];
      const isWon = current.word.split("").every(letter => guessedLetters.has(letter));

      if (isWon) {
        setTimeout(() => {
          alert("Correct!");
          loadNextWord();
        }, 300);
      } else if (mistakes >= MAX_WRONG) {
        setTimeout(() => {
          loadNextWord();
        }, 500);
      }
    }

    initKeyboard();
    loadWord();
  </script>
</body>
</html>
